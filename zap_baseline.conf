# ZAP Baseline Configuration for Workout Log API
# zap-baseline.py -c zap_baseline.conf

# General settings
exclude = \.css$
exclude = \.js$
exclude = \.png$
exclude = \.jpg$

# Scan settings
scanners = all
levels = I,H,M,L

# Context settings (если есть авторизация)
#context = workout-context
#user = test-user

# Timeouts
connectionTimeout = 20
ioTimeout = 60
