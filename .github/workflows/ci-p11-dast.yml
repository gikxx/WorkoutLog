name: Security - DAST with OWASP ZAP (P11)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/ci-p11-dast.yml"
      - "zap_baseline.conf"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast_p11:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare evidence directories
        run: |
          mkdir -p EVIDENCE/P11
          mkdir -p .zap-output

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FastAPI app
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &

          # Ждем готовности
          echo "Waiting for app health-check..."
          timeout 60 bash -c '
            for i in {1..30}; do
              if curl -s -f http://localhost:8000/health >/dev/null 2>&1; then
                echo ""
                echo "App ready!"
                exit 0
              fi
              echo -n "."
              sleep 2
            done
            echo ""
            echo "Health-check timeout"
            exit 1
          '

      - name: Run OWASP ZAP Baseline Scan
        run: |
          echo "Starting ZAP baseline scan..."
          docker run --rm --user root --network host \
            -v $PWD/.zap-output:/zap/wrk/output \
            -v $PWD/zap_baseline.conf:/zap/wrk/zap_baseline.conf \
            zaproxy/zap-stable:latest \
            zap-baseline.py \
              -t http://localhost:8000 \
              -r output/zap_baseline.html \
              -J output/zap_baseline.json \
              -d \
              -c zap_baseline.conf || true

      - name: Move results to evidence directory
        run: |
          cp .zap-output/zap_baseline.* EVIDENCE/P11/ 2>/dev/null || true
          echo "Files in EVIDENCE/P11:"
          ls -la EVIDENCE/P11/ || true

      - name: Generate DAST summary
        run: |
          echo "# P11 - DAST Scan Summary" > EVIDENCE/P11/dast_summary.md
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> EVIDENCE/P11/dast_summary.md
          echo "Target: http://localhost:8000" >> EVIDENCE/P11/dast_summary.md
          echo "Health endpoint: /health" >> EVIDENCE/P11/dast_summary.md
          echo "" >> EVIDENCE/P11/dast_summary.md

          if [ -f EVIDENCE/P11/zap_baseline.json ]; then
            echo "## Scan Results" >> EVIDENCE/P11/dast_summary.md

            # Статистика
            total=$(jq '.alerts | length' EVIDENCE/P11/zap_baseline.json 2>/dev/null || echo "0")
            high=$(jq '[.alerts[] | select(.risk=="High")] | length' EVIDENCE/P11/zap_baseline.json 2>/dev/null || echo "0")
            medium=$(jq '[.alerts[] | select(.risk=="Medium")] | length' EVIDENCE/P11/zap_baseline.json 2>/dev/null || echo "0")
            low=$(jq '[.alerts[] | select(.risk=="Low")] | length' EVIDENCE/P11/zap_baseline.json 2>/dev/null || echo "0")

            echo "Total alerts: $total" >> EVIDENCE/P11/dast_summary.md
            echo "High: $high | Medium: $medium | Low: $low" >> EVIDENCE/P11/dast_summary.md

            if [ "$high" -gt 0 ] || [ "$medium" -gt 0 ]; then
              echo "" >> EVIDENCE/P11/dast_summary.md
              echo "## Alerts for analysis (★★2)" >> EVIDENCE/P11/dast_summary.md
              jq -r '.alerts[] | select(.risk=="High" or .risk=="Medium") | "**" + .risk + "**: " + .name + " - " + (.description[0:80] + "...")' \
                EVIDENCE/P11/zap_baseline.json 2>/dev/null | head -2 >> EVIDENCE/P11/dast_summary.md || true
            fi
          else
            echo "No scan results available" >> EVIDENCE/P11/dast_summary.md
          fi

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
          retention-days: 30
