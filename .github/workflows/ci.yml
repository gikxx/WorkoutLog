name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

      - name: Check imports with isort
        run: isort --check-only .

      - name: Run tests with environment variables
        env:
          database_url: ${{ secrets.TEST_DATABASE_URL }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          mkdir -p reports
          pytest --cov=app --cov-report=xml --cov-report=html --junitxml=reports/junit.xml -q

      - name: Check coverage quality gate
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.get('line-rate')) * 100
          print(f'Coverage: {coverage:.2f}%')
          assert coverage >= 80, f'Coverage {coverage:.2f}% < 80% - Quality gate failed'
          print('Quality gate passed: coverage ≥ 80%')
          "

      - name: Upload test reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            reports/
            coverage.xml
            htmlcov/

  deploy:
    runs-on: ubuntu-latest
    needs: [ test ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "🚀 Triggering deployment to Render..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
          echo "✅ Deployment triggered successfully!"
