name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    branches: [p10-sast-secrets]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.java"
      - "**/*.go"
      - "security/**"
      - ".github/workflows/ci-sast-secrets.yml"

  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.java"
      - "**/*.go"
      - "security/**"
      - ".github/workflows/ci-sast-secrets.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast_secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure evidence directory
        run: mkdir -p EVIDENCE/P10

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            returntocorp/semgrep:latest \
            semgrep ci \
            --config "p/ci" \
            --config "/src/security/semgrep/rules.yml" \
            --sarif \
            --output "/src/EVIDENCE/P10/semgrep.sarif" \
            --metrics=off \
            --no-rewrite-rule-ids \
            --strict
        continue-on-error: true

      - name: Run Gitleaks secrets detection
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --no-banner \
            --config="/repo/security/.gitleaks.toml" \
            --source="/repo" \
            --report-format=json \
            --report-path="/repo/EVIDENCE/P10/gitleaks.json"
        continue-on-error: true

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-sast-secrets-evidence
          path: EVIDENCE/P10/
          retention-days: 7
