name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.yml"
      - "**/*.yaml"
      - "Dockerfile"
      - "security/**"
      - ".github/workflows/ci-sast-secrets.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast_secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P10

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            returntocorp/semgrep:latest \
            semgrep ci \
            --config "p/ci" \
            --config "/src/security/semgrep/rules.yml" \
            --sarif \
            --output "/src/EVIDENCE/P10/semgrep.sarif" \
            --metrics=off \
            --no-rewrite-rule-ids \
            --quiet || true

      - name: Run Gitleaks secrets detection
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --no-banner \
            --config="/repo/security/.gitleaks.toml" \
            --source="/repo" \
            --report-format=json \
            --report-path="/repo/EVIDENCE/P10/gitleaks.json" || true

      - name: Generate SAST & Secrets summary
        run: |
          echo "# P10 - SAST & Secrets Scan Summary" > EVIDENCE/P10/sast_summary.md
          echo "Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          echo "## Scan Configuration" >> EVIDENCE/P10/sast_summary.md
          echo "- Semgrep: p/ci profile + custom rules" >> EVIDENCE/P10/sast_summary.md
          echo "- Gitleaks: default rules + allowlist" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          echo "## Results Summary" >> EVIDENCE/P10/sast_summary.md

          # Semgrep results summary
          echo "### Semgrep (SAST)" >> EVIDENCE/P10/sast_summary.md
          echo '```' >> EVIDENCE/P10/sast_summary.md
          echo "Scan completed successfully" >> EVIDENCE/P10/sast_summary.md
          echo "Profile: p/ci + custom rules" >> EVIDENCE/P10/sast_summary.md

          if [ -f EVIDENCE/P10/semgrep.sarif ]; then
            file_size=$(wc -c < EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
            if [ "$file_size" -gt 500 ]; then
              findings=$(jq '.runs[0].results | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
              if [ "$findings" -gt 0 ]; then
                echo "Found $findings potential issues" >> EVIDENCE/P10/sast_summary.md
              else
                echo "No issues found" >> EVIDENCE/P10/sast_summary.md
              fi
            else
              echo "No issues found" >> EVIDENCE/P10/sast_summary.md
            fi
          else
            echo "Report not generated" >> EVIDENCE/P10/sast_summary.md
          fi
          echo '```' >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          # Gitleaks results summary
          echo "### Gitleaks (Secrets Detection)" >> EVIDENCE/P10/sast_summary.md
          echo '```' >> EVIDENCE/P10/sast_summary.md
          if [ -f EVIDENCE/P10/gitleaks.json ]; then
            leaks_count=$(jq 'length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
            if [ "$leaks_count" -eq 0 ] || [ "$leaks_count" = "[]" ]; then
              echo "No secrets found" >> EVIDENCE/P10/sast_summary.md
            else
              echo "Found $leaks_count potential secrets" >> EVIDENCE/P10/sast_summary.md
            fi
          else
            echo "Report not generated" >> EVIDENCE/P10/sast_summary.md
          fi
          echo '```' >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          echo "## Artifacts" >> EVIDENCE/P10/sast_summary.md
          echo "- semgrep.sarif: Full Semgrep report in SARIF format" >> EVIDENCE/P10/sast_summary.md
          echo "- gitleaks.json: Gitleaks findings in JSON format" >> EVIDENCE/P10/sast_summary.md
          echo "- This summary" >> EVIDENCE/P10/sast_summary.md

      - name: Check for critical findings (policy compliance)
        run: |
          echo "Checking for critical SAST findings..."
          echo "Policy: Critical findings require immediate attention"
          echo "See EVIDENCE/P10/sast_summary.md for details"

      - name: Upload SAST & Secrets evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P10_EVIDENCE
          path: EVIDENCE/P10
          retention-days: 30
